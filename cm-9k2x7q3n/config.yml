backend:
  name: github
  repo: PyAimind/hvac-portfolio
  branch: main

media_folder: "assets/img/uploads"
public_folder: "/assets/img/uploads"

collections:
  - name: "profile"
    label: "Profile"
    files:
      - name: "profile"
        label: "Personal Info"
        file: "data/profile.json"
        fields:
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Summary", name: "summary", widget: "text" }
          - { label: "Location", name: "location", widget: "string" }
          - { label: "CV Path", name: "cv", widget: "string" }
          - label: "Stats"
            name: "stats"
            widget: "list"
            fields:
              - { label: "Value", name: "value", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }
          - label: "Languages"
            name: "languages"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Level", name: "level", widget: "string" }

  - name: "projects"
    label: "Projects"
    files:
      - name: "projects"
        label: "Project List"
        file: "data/projects.json"
        fields:
          - label: "Projects"
            name: "projects"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Location", name: "location", widget: "string" }
              - { label: "Year", name: "year", widget: "string" }
              - { label: "Category", name: "category", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Cover Image", name: "cover", widget: "string" }
              - { label: "Summary", name: "summary", widget: "text" }
              - { label: "Tags", name: "tags", widget: "list" }
              - { label: "Featured", name: "featured", widget: "boolean" }
              - label: "Stats"
                name: "stats"
                widget: "list"
                fields:
                  - { label: "Value", name: "value", widget: "string" }
                  - { label: "Label", name: "label", widget: "string" }
              - label: "Challenges"
                name: "challenges"
                widget: "list"
                fields:
                  - { label: "Problem", name: "problem", widget: "text" }
                  - { label: "Solution", name: "solution", widget: "text" }

  - name: "experience"
    label: "Experience"
    files:
      - name: "experience"
        label: "Work History"
        file: "data/experience.json"
        fields:
          - label: "Jobs"
            name: "jobs"
            widget: "list"
            fields:
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Company", name: "company", widget: "string" }
              - { label: "Location", name: "location", widget: "string" }
              - { label: "Period", name: "period", widget: "string" }
              - { label: "Highlights", name: "highlights", widget: "list" }

  - name: "skills"
    label: "Skills"
    files:
      - name: "skills"
        label: "Technical Skills"
        file: "data/skills.json"
        fields:
          - label: "Skill Groups"
            name: "groups"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Items", name: "items", widget: "list" }

  - name: "certifications"
    label: "Certifications"
    files:
      - name: "certifications"
        label: "Education & Certificates"
        file: "data/certifications.json"
        fields:
          - label: "Certifications"
            name: "certs"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Issuer", name: "issuer", widget: "string", required: false }
              - { label: "Year", name: "year", widget: "string", required: false }